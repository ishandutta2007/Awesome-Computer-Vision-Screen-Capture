<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="12" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Radar & Scanlines -->
  <g opacity="0.45">
    <!-- Ambient ambient radial pulse -->
    <circle cx="980" cy="180" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 980 180" to="360 980 180" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="180" r="90" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 980 180" to="0 980 180" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="180" r="45" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="35;55;35" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Reticle target crosshairs -->
    <line x1="980" y1="30" x2="980" y2="330" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5,5" />
    <line x1="830" y1="180" x2="1130" y2="180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5,5" />

    <!-- Corner bounding markers -->
    <path d="M 860 80 L 840 80 L 840 100" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 1100 80 L 1120 80 L 1120 100" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 840 260 L 840 280 L 860 280" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 1120 260 L 1120 280 L 1100 280" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Scanning beam -->
    <line x1="840" y1="180" x2="1120" y2="180" stroke="url(#cyanGlow)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="y1" values="90; 270; 90" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="90; 270; 90" dur="3.5s" repeatCount="indefinite" />
    </line>

    <!-- Detected visual bounding boxes simulating CV perception -->
    <rect x="880" y="110" width="70" height="35" rx="4" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </rect>
    <text x="884" y="104" fill="#38bdf8" font-size="10" font-weight="bold" letter-spacing="1">BUTTON 98%</text>

    <rect x="1000" y="190" width="95" height="50" rx="4" fill="rgba(192, 132, 252, 0.08)" stroke="#c084fc" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="1004" y="184" fill="#c084fc" font-size="10" font-weight="bold" letter-spacing="1">INPUT_FIELD</text>

    <circle cx="1040" cy="140" r="4" fill="#4ade80" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Tags -->
  <g transform="translate(60, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 48)">
      <rect width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Computer Vision &amp; Screen Capture
    </text>
    <text x="0" y="132" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Computer Vision &amp; Screen Capture
    </text>

    <!-- Subtitle -->
    <text x="0" y="176" fill="#e2e8f0" font-size="20" font-weight="600" opacity="0.95">
      High-FPS Screen Perception • Vision-Based UI Automation • AI Agent Vision
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="214" fill="#94a3b8" font-size="14.5" font-weight="400">
      Comprehensive guide to enterprise SaaS platforms &amp; high-performance open-source libraries
    </text>
    <text x="0" y="236" fill="#94a3b8" font-size="14.5" font-weight="400">
      empowering autonomous computer-use agents, multi-modal VLMs, and zero-latency capture pipelines.
    </text>

    <!-- Interactive / Status Badges row -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: DXGI / WinRT / GPU -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#38bdf8" font-size="12.5" font-weight="600">⚡ 240Hz+ Capture</text>
      </g>

      <!-- Pill 2: Agent Vision -->
      <g transform="translate(142, 0)">
        <rect width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#a78bfa" font-size="12.5" font-weight="600">🤖 Autonomous Agents</text>
      </g>

      <!-- Pill 3: Enterprise RPA -->
      <g transform="translate(299, 0)">
        <rect width="140" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#34d399" font-size="12.5" font-weight="600">🏢 Enterprise RPA</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(451, 0)">
        <rect width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#f472b6" font-size="12.5" font-weight="600">⭐ Open-Source</text>
      </g>
    </g>
  </g>
</svg>
